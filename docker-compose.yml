services:
  # Minecraft puts the hostname the player dialled inside its handshake, so one
  # listener on 25565 can fan out to every server by name. That is what makes
  # "<server>.mc.ramflix.xyz" work with no port, no SRV record and no per-server
  # DNS - a single wildcard record and a single forwarded port cover all of them.
  mc-router:
    image: itzg/mc-router:latest
    container_name: mc-router
    restart: unless-stopped
    ports:
      - "25565:25565"
    volumes:
      # Not :ro - the router starts stopped containers for AUTO_SCALE_UP.
      # (:ro on a docker socket does not restrict the API anyway, so leaving it
      # there would only have been misleading.)
      - /var/run/docker.sock:/var/run/docker.sock
    # The image runs as uid 65532, which cannot read the 0660 root:docker
    # socket. Joining the docker group beats running the router as root.
    # 991 is the docker gid inside LXC 105 - check with:
    #   stat -c '%g' /var/run/docker.sock
    group_add:
      - "991"
    environment:
      IN_DOCKER: "true"
      API_BINDING: ":8080"
      CONNECTION_RATE_LIMIT: "20"
      DEBUG: "false"
      # A stopped server has no route, so joining it just fails - which from
      # outside is indistinguishable from the whole setup being broken. This
      # starts it on demand instead, so the link always works.
      AUTO_SCALE_UP: "true"
      AUTO_SCALE_LOADING_MOTD: "§eStarting up… §7rejoin in a moment"
      AUTO_SCALE_ASLEEP_MOTD: "§7Asleep — §fjoin to wake it up"
    networks:
      - ramcraft

  # Split DNS so the public hostname also works from inside the house, where
  # the router has no NAT loopback. Point a device's DNS at 192.168.1.63 and
  # <server>.mc.ramflix.xyz resolves to the box directly instead of the WAN IP.
  ramcraft-dns:
    build: ./dns
    image: ramcraft-dns:latest
    container_name: ramcraft-dns
    restart: unless-stopped
    ports:
      - "53:53/udp"
      - "53:53/tcp"
    environment:
      RAMCRAFT_ROUTER_DOMAIN: mc.ramflix.xyz
      RAMCRAFT_LAN_HOST: 192.168.1.63
    networks:
      - ramcraft

  ramcraft:
    build: ./panel
    image: ramcraft-panel:latest
    container_name: ramcraft
    restart: unless-stopped
    ports:
      - "8110:8080"
    volumes:
      # The panel drives the Minecraft containers directly.
      - /var/run/docker.sock:/var/run/docker.sock
      # Same path inside and out, so the bind mounts it creates resolve on the host.
      - /srv/mc:/srv/mc
    environment:
      RAMCRAFT_DATA: /srv/mc
      RAMCRAFT_NETWORK: ramcraft
      RAMCRAFT_LAN_HOST: 192.168.1.63
      # Every server is published as <id>.<this> by mc-router.
      RAMCRAFT_ROUTER_DOMAIN: mc.ramflix.xyz
      RAMCRAFT_ROUTER_API: http://mc-router:8080
      # 25565 belongs to mc-router, so direct LAN ports start above it.
      RAMCRAFT_PORT_BASE: "25566"
      RAMCRAFT_PORT_MAX: "25640"
      RAMCRAFT_MEM_BUDGET_GB: "24"
      TZ: Asia/Jerusalem
    networks:
      - ramcraft
    depends_on:
      - mc-router

networks:
  ramcraft:
    name: ramcraft
    driver: bridge
