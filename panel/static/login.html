<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sign in — RamCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- Self-contained on purpose: style.css and app.js sit behind the sign-in. -->
<style>
  :root {
    --bg: #f6f8fb;
    --bg-grad: linear-gradient(180deg, #e9f2fa 0%, #f6f8fb 420px);
    --surface: #ffffff;
    --border: #d5dfe8;
    --text: #2b3742;
    --muted: #64717d;
    --faint: #929fab;
    --accent: #3f96cf;
    --accent-soft: #3f96cf1f;
    --accent-dim: #2b7cb3;
    --red: #cb4a41;
    --sidebar: oklch(.24 .017 247);
    --radius: 14px;
    --radius-sm: 9px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid; place-items: center;
    padding: 24px 16px;
    background: var(--bg) var(--bg-grad) no-repeat;
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 380px; }
  .brand { display: flex; align-items: center; gap: 12px; margin: 0 0 22px 4px; color: var(--sidebar); }
  .brand svg { width: 34px; height: 34px; color: var(--accent-dim); }
  .brand-name { font-size: 26px; font-weight: 750; letter-spacing: -1.1px; line-height: 1; }
  .brand-name span { color: var(--accent); }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 26px 26px;
    box-shadow: 0 12px 30px -14px #33475a38;
  }
  h1 { margin: 0 0 4px; font-size: 21px; font-weight: 700; letter-spacing: -.3px; }
  .sub { margin: 0 0 22px; font-size: 13.5px; color: var(--muted); }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; letter-spacing: .2px; }
  input {
    width: 100%; font: inherit; font-size: 15px;
    background: #fff; color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 11px 12px; margin: 0 0 16px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  button {
    width: 100%; min-height: 46px; margin-top: 4px;
    font: inherit; font-size: 15px; font-weight: 650; color: #fff;
    background: linear-gradient(175deg, #56a8dc, #2f80ba);
    border: 1px solid #2b7cb3; border-radius: var(--radius-sm);
    box-shadow: inset 0 1px 0 #ffffff59, 0 4px 14px -8px #2b7cb3cc;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: linear-gradient(175deg, #66b4e5, #3789c4); }
  button:disabled { opacity: .6; cursor: wait; }
  .error {
    margin: 0 0 16px; padding: 10px 12px;
    font-size: 13px; color: #8f322c;
    background: #fdf1f0; border: 1px solid #e3bdb9; border-radius: var(--radius-sm);
  }
  .error[hidden] { display: none; }
  .foot { margin: 16px 4px 0; font-size: 12px; color: var(--faint); }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
    <span class="brand-name">ramcraft<span>.</span></span>
  </div>
  <form class="card" id="form" novalidate>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to manage your worlds.</p>
    <p class="error" id="error" role="alert" hidden></p>
    <label for="user">Username</label>
    <input id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="submit">Sign in</button>
  </form>
  <p class="foot">Players never need this — they join with the world’s address.</p>
</main>
<script>
  const form = document.getElementById('form');
  const err = document.getElementById('error');
  const btn = document.getElementById('submit');
  document.getElementById('user').focus();

  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.hidden = true;
    const user = form.username.value.trim();
    const password = form.password.value;
    if (!user || !password) {
      err.textContent = 'Enter your username and password.';
      err.hidden = false;
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user, password }),
      });
      if (res.ok) { location.replace('/'); return; }
      const data = await res.json().catch(() => ({}));
      err.textContent = data.detail || 'Could not sign in.';
    } catch {
      err.textContent = 'Could not reach the panel. Check your connection and try again.';
    }
    err.hidden = false;
    btn.disabled = false;
    btn.textContent = 'Sign in';
    form.password.select();
  });
</script>
</body>
</html>
